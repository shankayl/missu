<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }

    @keyframes glowPulse {
      0%,100% { text-shadow: 0 0 8px #fff, 0 0 20px #fff, 0 0 40px #ccc; opacity:1; }
      50%      { text-shadow: 0 0 20px #fff, 0 0 60px #ddd, 0 0 100px #fff; opacity:0.8; }
    }
    @keyframes floatUpDown {
      0%,100% { transform: translate(-50%,-50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) translateY(0px); }
      50%      { transform: translate(-50%,-50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) translateY(-10px); }
    }

    #msg.active { animation: glowPulse 2s ease-in-out infinite; }

    .floatpic {
      position:absolute; top:42%; left:50%;
      transform: translate(-50%,-50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(0.5);
      opacity:0;
      transition: opacity 0.5s ease var(--delay), transform 0.5s cubic-bezier(.34,1.56,.64,1) var(--delay);
      width:90px; height:90px; border-radius:10px; overflow:hidden;
    }
    .floatpic img { width:100%; height:100%; object-fit:cover; display:block; }

    .floatpic.active {
      opacity:1;
      transform: translate(-50%,-50%) translate(var(--tx), var(--ty)) rotate(var(--rot)) scale(1);
      animation: floatUpDown 3s ease-in-out infinite var(--delay);
      box-shadow: 0 0 12px rgba(255,255,255,0.2), 0 4px 20px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

<div style="position:relative;width:100%;height:100vh;overflow:hidden;background:#000;">
  <canvas id="c" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>

  <div id="pics" style="position:absolute;inset:0;pointer-events:none;">
    <div class="floatpic" style="--tx:-155px;--ty:-80px;--rot:-12deg;--delay:0s;">
      <img src="03d15f27-e5d1-4b8d-b327-6921e57fd912.jpg" alt="mountain"/>
    </div>
    <div class="floatpic" style="--tx:155px;--ty:-90px;--rot:10deg;--delay:0.3s;">
      <img src="74b1fdb1-cde0-400f-8c57-a3c050fef5c1.jpg" alt="galaxy"/>
    </div>
    <div class="floatpic" style="--tx:-170px;--ty:70px;--rot:8deg;--delay:0.6s;">
      <img src="98a9b550-3183-471b-8c26-86af02d4b8d1.jpg" alt="forest"/>
    </div>
    <div class="floatpic" style="--tx:170px;--ty:75px;--rot:-9deg;--delay:0.9s;">
      <img src="ad25dd03-a08d-41d1-9e46-f293f903323b.jpg" alt="beach"/>
    </div>
    <div class="floatpic" style="--tx:0px;--ty:-145px;--rot:4deg;--delay:0.45s;">
      <img src="b3604bd4-1c6a-4214-886b-eb59b23f4768.jpg" alt="desert"/>
    </div>
    <div class="floatpic" style="--tx:0px;--ty:145px;--rot:-5deg;--delay:0.75s;">
      <img src="d81c5ccd-eedf-4bde-82a8-1c9c98cbd417.jpg" alt="aurora"/>
    </div>
  </div>

  <div id="msg" style="
    position:absolute;top:42%;left:50%;
    transform:translate(-50%,-50%) scale(0.85);
    opacity:0;pointer-events:none;z-index:10;
    width:280px;text-align:center;
    transition:opacity 0.4s ease, transform 0.4s ease;
  ">
    <p style="
      font-family:Georgia,serif;font-size:15px;font-weight:400;
      color:#fff;letter-spacing:0.8px;line-height:1.8;margin:0;
    ">
      <span style="font-size:19px;font-weight:700;display:block;margin-bottom:8px;letter-spacing:1.5px;">Happy Monthsary, Babe! </span>
      I'm so thankful na palagi kang nasa tabi ko, palagi kang naka support sa akin, and especially thank you sa pag pili mo sa akin araw-araw. I cannot just express all my love for you through words.<br><br>
      <span style="font-size:16px;font-weight:700;letter-spacing:2px;">MAHAL NA MAHAL KITA, KATE</span>
    </p>
  </div>

  <button id="btn" onclick="toggleMsg()" style="
    position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;
    background:transparent;border:1px solid rgba(255,255,255,0.25);
    color:rgba(255,255,255,0.8);font-family:sans-serif;font-size:13px;
    letter-spacing:1.5px;padding:10px 28px;border-radius:999px;
    cursor:pointer;transition:border-color 0.3s,color 0.3s;
  "
  onmouseover="this.style.borderColor='rgba(255,255,255,0.6)';this.style.color='#fff';"
  onmouseout="this.style.borderColor='rgba(255,255,255,0.25)';this.style.color='rgba(255,255,255,0.8)';"
  >REVEAL 🤍</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

const NUM = 280;
const particles = Array.from({length: NUM}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2.2 + 0.3,
  vx: (Math.random() - 0.5) * 0.6,
  vy: (Math.random() - 0.5) * 0.6,
  alpha: Math.random() * 0.6 + 0.15,
  drift: Math.random() * Math.PI * 2,
  driftSpeed: Math.random() * 0.01 + 0.003,
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const W = canvas.width, H = canvas.height;
  for (let p of particles) {
    p.drift += p.driftSpeed;
    p.x += p.vx + Math.sin(p.drift) * 0.25;
    p.y += p.vy + Math.cos(p.drift * 0.7) * 0.18;
    if (p.x < -5) p.x = W + 5;
    if (p.x > W + 5) p.x = -5;
    if (p.y < -5) p.y = H + 5;
    if (p.y > H + 5) p.y = -5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    const shade = Math.floor(60 + Math.random() * 80);
    ctx.fillStyle = `rgba(${shade},${shade},${shade},${p.alpha})`;
    ctx.fill();
  }
  ctx.strokeStyle = 'rgba(90,90,90,0.04)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 55) {
        ctx.globalAlpha = (1 - dist / 55) * 0.12;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

let visible = false;
function toggleMsg() {
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const pics = document.querySelectorAll('.floatpic');
  visible = !visible;
  if (visible) {
    msg.style.opacity = '1';
    msg.style.transform = 'translate(-50%,-50%) scale(1)';
    msg.classList.add('active');
    pics.forEach(p => p.classList.add('active'));
    btn.textContent = 'HIDE';
  } else {
    msg.style.opacity = '0';
    msg.style.transform = 'translate(-50%,-50%) scale(0.85)';
    msg.classList.remove('active');
    pics.forEach(p => p.classList.remove('active'));
    btn.textContent = 'click this babe';
  }
}
</script>
</body>
</html>
